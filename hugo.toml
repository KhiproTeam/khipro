baseURL = "https://khipro.khiproteam.com/"
locale = "bn"
title = "ক্ষিপ্র কিবোর্ড"
defaultContentLanguage = "bn"

canonifyURLs = true
relativeURLs = false

# Root-level keys must stay above any [table] header — previously these sat
# under [params] and were silently ignored as params.
disableKinds = ["taxonomy", "term"]

# Automatic lastmod dates from git history (used by the generated sitemap)
enableGitInfo = true

[sitemap]
  changefreq = "monthly"
  priority = 0.5

[params]
description = "দ্রুততম বাংলা কিবোর্ড"
keywords = "বাংলা কিবোর্ড, ক্ষিপ্র কিবোর্ড, বাংলা টাইপিং, Bengali keyboard, Khipro, Bangla typing"
author = "KhiproTeam"

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
  codeFences = true
  guessSyntax = false
  lineNos = false
  lineNumbersInTable = false
  # Inline styles bake `display:flex` on line wrappers (+ stray newlines flex-stretch badly). Use classes + stylesheet.
  noClasses = false
  style = "monokai"

[markup.tableOfContents]
startLevel = 2
endLevel = 4
ordered = false

[outputs]
home = ["HTML"]
section = ["HTML"]
page = ["HTML"]
